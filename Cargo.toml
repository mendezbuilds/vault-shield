[package]
name = "vault-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
members = [
    ".",
    "tests/toolchain-proof"
]
